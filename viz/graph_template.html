<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Visualization</title>
    <link rel="stylesheet" href="graph_widgets.css">
</head>
<body>
    <div id="search-container">
        <div id="search-header">
            <span id="search-label">Filters</span>
            {% if filter_reflexive %}
            <span style="background: #e74c3c; color: white; padding: 3px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; margin-left: 8px;">REFLEXIVE FILTERED</span>
            {% endif %}
            <button id="toggle-btn">Hide</button>
        </div>
        <div id="search-content">
            <div style="font-size: 13px; color: #2c3e50; margin-bottom: 10px; margin-top: 15px; font-weight: 600; border-bottom: 1px solid #e0e0e0; padding-bottom: 5px;">Filter Edges</div>
            <div id="edge-controls">
                {{ edge_controls }}
            </div>
            <div style="font-size: 13px; color: #2c3e50; margin-bottom: 10px; margin-top: 15px; font-weight: 600; border-bottom: 1px solid #e0e0e0; padding-bottom: 5px;">Filter Nodes</div>
            <div style="margin: 10px 0; padding: 8px; background: #f8f9fa; border-radius: 4px; border: 1px solid #dee2e6;">
                <div style="font-size: 11px; color: #555; margin-bottom: 5px;">Filter mode:</div>
                <label style="margin-bottom: 3px; display: block; font-size: 12px;">
                    <input type="radio" name="filter-mode" value="include" checked />
                    <span class="edge-label">Include (show selected & neighbors)</span>
                </label>
                <label style="margin-bottom: 0; display: block; font-size: 12px;">
                    <input type="radio" name="filter-mode" value="exclude" />
                    <span class="edge-label">Exclude (hide selected nodes)</span>
                </label>
            </div>
            <div style="font-size: 12px; color: #555; margin-bottom: 8px; font-weight: 600;">Filter Partitions</div>
            <div id="partition-controls">
                <div style="margin-bottom: 10px; padding: 8px; background: #f8f9fa; border-radius: 4px; border: 1px solid #dee2e6;">
                    <div id="partition-stats" style="font-size: 10px; color: #666;">
                    </div>
                </div>
                <div id="scc-controls-container">
                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="scc-toggle" />
                            Collapse SCCs
                        </label>
                    </div>
                </div>
                <input type="text" id="partition-search-input" placeholder="Filter partitions by name..." />
                <div id="partition-list">
                    {{ partition_controls }}
                </div>
                <div id="selected-partitions"></div>
            </div>
            <div style="font-size: 12px; color: #555; margin-bottom: 8px; font-weight: 600;">Filter Specific Nodes</div>
            <div id="selection-controls">
                <div style="margin-top: 3px;">
                    <div style="font-size: 11px; color: #555; margin-bottom: 5px;">Edge direction:</div>
                    <label style="margin-bottom: 3px; font-size: 12px;">
                        <input type="radio" name="edge-direction" value="both" checked />
                        <span class="edge-label">Both</span>
                    </label>
                    <label style="margin-bottom: 3px; font-size: 12px;">
                        <input type="radio" name="edge-direction" value="outgoing" />
                        <span class="edge-label">Outgoing only</span>
                    </label>
                    <label style="margin-bottom: 3px; font-size: 12px;">
                        <input type="radio" name="edge-direction" value="incoming" />
                        <span class="edge-label">Incoming only</span>
                    </label>
                </div>
            </div>
            <div id="node-controls">
                <label>
                    <input type="checkbox" id="select-leaf-nodes" />
                    <span class="edge-label">Select all leaf nodes (blue, no outgoing edges)</span>
                </label>
                <label>
                    <input type="checkbox" id="select-source-nodes" />
                    <span class="edge-label">Select all source nodes (purple, no incoming edges)</span>
                </label>
            </div>
            <input type="text" id="search-input" placeholder="Filter by name..." />
            <div id="dropdown-list">
                {{ checkbox_items }}
            </div>
            <div id="selected-nodes"></div>
            <div id="button-container">
                <button class="btn btn-clear" id="btn-clear">Clear All</button>
            </div>
            <div id="search-results"></div>
        </div>
    </div>
    
    <div id="rankings-container">
        <div id="rankings-header">
            <span id="rankings-label">Node Rankings</span>
            <button id="rankings-toggle-btn">Hide</button>
        </div>
        <div id="rankings-content">
            <div class="ranking-section">
                <h4>Most Outgoing Edges</h4>
                <div id="outgoing-ranking" class="ranking-list"></div>
            </div>
            <div class="ranking-section">
                <h4>Most Inbound Edges</h4>
                <div id="inbound-ranking" class="ranking-list"></div>
            </div>
        </div>
    </div>
    
    <script type="text/javascript">
        // Graph data configuration
        var graphData = {
            leafNodeNames: {{ leaf_nodes_json }},
            sourceNodeNames: {{ source_nodes_json }},
            sccMap: {{ scc_map_json }},
            sccs: {{ sccs_json }},
            partitions: {{ partitions_json }},
            partitionLabels: {{ partition_labels_json }},
            stats: {{ stats_json }}
        };
        
        // Legacy compatibility - keep global variables for existing code
        var leafNodeNames = graphData.leafNodeNames;
        var sourceNodeNames = graphData.sourceNodeNames;
        var sccMap = graphData.sccMap;
        var sccs = graphData.sccs;
        var partitions = graphData.partitions;
        var partitionLabels = graphData.partitionLabels;
    </script>
    <script src="utils/edges.js"></script>
    <script src="utils/nodes.js"></script>
    <script src="utils/filters.js"></script>
    <script src="utils/rankings.js"></script>
    <script src="utils/scc.js"></script>
    <script src="utils/partitions.js"></script>
    <script src="utils/ui_state.js"></script>
    <script src="utils/highlighting.js"></script>
    <script src="graph_widgets.js"></script>
</body>
</html>
