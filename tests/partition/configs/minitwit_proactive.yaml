# Workflow name (used for logging/output identification)
name: "minitwit_proactive_gdpr"

# Input files
input:
  mfotl: "../proactive-enforcement-library/miniTwitter_gdpr/policies/reference/minitwit_gdpr.mfotl.mfotl"
  signature: "../proactive-enforcement-library/miniTwitter_gdpr/policies/reference/minitwit_gdpr.mfotl.sig"
  
  # Option 1: Run on specific logs (explicit list)
  logs:
   # - "../../whyenf/ressources/minitwit/test_logs/minitwit_compliant.log"
  # - "../../whyenf/ressources/minitwit/minitwit_gdpr.log"
    - "../../whyenf/ressources/minitwit/test_logs/minitwit_access_request.log"
  #log_directory: "../../whyenf/ressources/minitwit/test_logs"  
  
  # Option 2: Process all log files in a directory
  # log_directory: "../../whyenf/ressources/minitwit/test_logs/"
  functions: "../../whyenf/ressources/gdpr.py"

# Output configuration
output:
  save_normalized_mfotl: true
  save_json: true

# Visualization & partitioning options
visualization:
  enabled: true
  filter_polarity: true
  merge_strategy: "by_descendants"
  #max_merge_size: 20

# Partition execution options (running enfguard on each partition)
partition_execution:
  enabled: false
  timeout: 3000 
  label: true
  step_by_step: true  # When true, ingest log file one timestamp at a time and measure enforcement time per step
  repeat_runs: 10  # Number of times to run each partition for timing measurements (default: 1). When > 1, only timing is recorded.
