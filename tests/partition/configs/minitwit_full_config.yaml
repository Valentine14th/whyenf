# Workflow name (used for logging/output identification)
name: "minitwit"

# Input files
input:
  mfotl: "ressources/minitwit/minitwit_gdpr.mfotl"
  signature: "ressources/minitwit/minitwit_gdpr.sig"
  log: "ressources/minitwit/test_logs/minitwit_compliant.log"
  functions: "ressources/gdpr.py"

# Output configuration
output:
  save_normalized_mfotl: true
  save_json: true

# Visualization & partitioning options
visualization:
  enabled: true
  filter_polarity: true
  merge_strategy: "by_descendants"
  #max_merge_size: 20

# Partition execution options (running enfguard on each partition)
partition_execution:
  enabled: true
  timeout: 300
  label: true
  step_by_step: false  # When true, ingest log file one timestamp at a time and measure enforcement time per step
