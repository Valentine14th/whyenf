# Partition Enforcement Configuration File
# Defines a workflow for partitioning MFOTL formulas and running enforcement

# Workflow name (used for logging/output identification)
name: "example"

# Enfguard binaries (optional, default: 'enfguard' relative to workspace root)
# visualization_binary: "enfguard"                 # for JSON/MFOTL generation
# enforcement_binary: "enfflash/bin/enfguard.exe"  # for partition execution
# enfguard_binary: "enfguard"                      # legacy: sets both at once

# Input files
input:
  mfotl: "tests/partition/test_formulas/minitwit_gdpr.mfotl"  # formula file
  signature: "tests/partition/test_formulas/minitwit_gdpr.sig"  # signature file
  functions: "tests/partition/test_formulas/gdpr.py"           # functions file

  # Logs for enforcement: explicit list, or a directory of .log files (pick one)
  # logs:
  #   - "tests/partition/test_logs/01_access_request.log"
  #   - "tests/partition/test_logs/02_portability_request.log"
  log_directory: "tests/partition/test_logs/"

# Output configuration
# Written to tests/partition/results/<name>/, with a log_<basename>/ subdir per log
output:
  save_json: true             # keep intermediate JSON generated from MFOTL
  save_normalized_mfotl: false  # save pretty-printed normalized MFOTL

# Visualization & partitioning options
visualization:
  enabled: true                     # generate graph and partitions
  filter_polarity: false            # drop polarity edges (CauByCau/CauBySup)
  merge_strategy: "by_descendants"  # "by_descendants" | "no_merge"
  max_merge_size: null              # cap partitions merged together (null = unlimited)
  merge_single_rule_components: true  # allow single-rule components to merge

# Partition execution options (running enfguard on each partition)
partition_execution:
  enabled: true       # run enfguard on partitions
  timeout: 300         # seconds per partition (or per step) before killing it
  partition_dir: null  # dir with partition .mfotl files (default: <output_dir>/mfotl)
  # partition_source_dir: "existing_output/mfotl"  # use pre-generated partitions instead of visualizing
  label: false          # show which rules caused each action
  step_by_step: true   # ingest one timestamp at a time, plot per-step timing
  repeat_runs: 1         # repeat each partition run N times for timing
  filter_log_by_signature: false    # filter log/signature per partition
  use_per_partition_signatures: false  # use each partition's own signature

# Note: paths are relative to workspace root unless absolute
