# Partition Enforcement Configuration File
# This config defines a workflow for partitioning MFOTL formulas and running enforcement

# Workflow name (used for logging/output identification)
name: "minitwit_gdpr_4_test"

# Input files
input:
  # MFOTL formula file
  mfotl: "ressources/minitwit/minitwit_gdpr_4.mfotl"
  
  # Signature file (defines predicates and their types)
  signature: "ressources/minitwit/minitwit_gdpr.sig"
  
  # Log files for enforcement execution (two options):
  
  # Option 1: Multiple log files (explicit list)
  logs:
    - "ressources/minitwit/log1.txt"
    - "ressources/minitwit/log2.txt"
    - "ressources/minitwit/log3.txt"
  
  # Option 2: Directory containing log files (all .log files will be processed)
  # log_directory: "ressources/minitwit/test_logs/"
  
  # Functions file for enforcement execution
  functions: "ressources/minitwit/func.txt"

# Output configuration
# Output configuration
# Note: Output directory is automatically set to tests/partition/results/<workflow_name>/
# When multiple logs are specified, results for each log will be in subdirectories:
#   tests/partition/results/<workflow_name>/log_<log_basename>/
#     ├── partition_outputs/  (enforcement outputs and diffs)
#     ├── plots/              (timing and statistics plots)
#     └── enforcement_results.json
output:
  # Whether to save the intermediate JSON file (generated from MFOTL)
  save_json: true
  
  # Whether to save normalized MFOTL file (pretty-printed version)
  save_normalized_mfotl: false

# Visualization & partitioning options
visualization:
  # Enable/disable graph generation and partitioning
  enabled: true
  
  # Filter out polarity edges (CauByCau+monotonic, CauBySup+antimonotonic)
  filter_polarity: false
  
  # Partition merging strategy
  # Options: "by_descendants" | "no_merge"
  merge_strategy: "by_descendants"
  
  # Maximum number of partitions to merge together, balanced split if over (optional)
  max_merge_size: null

# Partition execution options (running enfguard on each partition)
partition_execution:
  # Enable/disable running enfguard on partitions
  enabled: true
  
  # Optional: Timeout in seconds for each partition (or per step if step_by_step is true)
  # If a partition takes longer than this, it will be killed
  timeout: 300
  
  # Directory containing partition MFOTL files (auto-set from output.directory/mfotl)
  # Leave null to use default: {output.directory}/mfotl
  partition_dir: null
  
  # Enable label output to show which rules caused actions
  label: false
  
  # Enable step-by-step execution mode: ingest log file one timestamp at a time 
  # and measure enforcement time per step (generates timing plot automatically)
  step_by_step: false
